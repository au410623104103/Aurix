services:
  # Render Express API Backend Service
  - type: web
    name: aurix-backend
    env: node
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aurix-postgres
          property: connectionString

databases:
  # Render Managed PostgreSQL Database
  - name: aurix-postgres
    databaseName: aurix_db
    user: aurix_user
    plan: free
